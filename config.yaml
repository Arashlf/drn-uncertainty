epidemiology:
  gamma: 0.14285714285714285   # 1/7 per day
  r_star: 2.0                  # nominal reproduction number R*
  theta: 0.3333333333333333    # 1/3 per day

states:
  - kansas
  - florida
  - california

simulation:
  seed: 42
  horizon_days: 365
  dt_days: 0.25       # stochastic_sir.py timestep
  n_seed_infected: 10 # stochastic_sir.py initial infected count in the seed county

study_design:
  primary_threshold: 10   # DRN analysis set is I(t) >= this
  availability_thresholds: [1, 5, 10, 20]

  true_count_groups:
    - {label: "10-19", low: 10, high: 20}
    - {label: "20-49", low: 20, high: 50}
    - {label: "50-99", low: 50, high: 100}
    - {label: ">=100", low: 100, high: null}

  seed_quantiles: [0.05, 0.25, 0.50, 0.75, 0.95]

  state_u_levels: [0.0, 0.2, 0.4, 0.6]
  coupling_b_levels: [0.0, 0.1, 0.25, 0.5]
  combined_scenario: {u: 0.40, b: 0.25}

  n_observation_draws: 10
  n_truth_realizations: 20
  bootstrap_replicates: 10000
  confidence_level: 0.95
